name: Daily Kostolany Analysis

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US
          - PORTFOLIO

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic requests schedule

      - name: 작업 실행
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ANTHROPIC_API_KEY:
