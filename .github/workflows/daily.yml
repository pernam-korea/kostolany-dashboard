name: Daily Kostolany Analysis

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'KR, US, PORTFOLIO 중 선택'
        required: true
        default: 'KR'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic requests schedule

      - name: 작업 실행
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            HOUR=$(TZ='Asia/Seoul' date +%H)
            if [ "$HOUR" -eq 7 ]; then
              JOB="KR"
            elif [ "$HOUR" -eq 20 ]; then
              JOB="US"
            else
              JOB="PORTFOLIO"
            fi
          fi
          echo "실행: $JOB"
          if [ "$JOB" = "KR" ]; then
            python kostolany_v3.py --market KR
          elif [ "$JOB" = "US" ]; then
            python kostolany_v3.py --market US
          else
            python kostolany_v4.py --check
          fi

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports_v4/
          git diff --staged --quiet || git commit -m "📊 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
